seed: 42
deterministic: true

data:
  root: handseal_dataset
  classes:
    - dragon
    - ram
    - snake
    - tiger
    - no_seal
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

training:
  model: small_cnn
  pretrained: false
  epochs: 20
  batch_size: 32
  num_workers: 0
  balanced_sampling: true
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  output_dir: artifacts
  report_dir: reports
