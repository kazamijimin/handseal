seed: 42
deterministic: true
data:
  root: handseal_dataset_external_v3
  classes:
  - dragon
  - ram
  - snake
  - tiger
  - no_seal
  image_size: 224
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
training:
  model: mobilenetv3_small
  pretrained: true
  epochs: 30
  batch_size: 32
  num_workers: 0
  balanced_sampling: false
  learning_rate: 3.0e-05
  weight_decay: 0.0001
  patience: 7
  output_dir: artifacts
  report_dir: reports/external_baseline_v1
